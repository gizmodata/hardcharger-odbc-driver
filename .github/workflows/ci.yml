name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to verify
        type: choice
        default: all
        options: [all, unix, windows]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  driver:
    uses: gizmodata/warp-sql-odbc/.github/workflows/ci.yml@7864c82f3a6146c25f160601e20a1aca4f43cc99
    with:
      platforms: ${{ inputs.platforms || 'all' }}
      source-root: third_party/warp-sql-odbc
      library-name: hardcharger-odbc
      driver-name: Hardcharger ODBC Driver
      msi-name: Hardcharger-ODBC-Driver-x64.msi
      extra-suite: integration_tests/test_hardcharger.py
    secrets: inherit
