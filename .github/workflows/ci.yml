name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to verify
        type: choice
        default: all
        options: [all, unix, windows]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  driver:
    uses: gizmodata/chargewire-odbc/.github/workflows/ci.yml@388e82542d328556d7856477d3f1b6bbfd88a6b1
    with:
      platforms: ${{ inputs.platforms || 'all' }}
      source-root: third_party/chargewire-odbc
      library-name: hardcharger-odbc
      driver-name: Hardcharger ODBC Driver
      msi-name: Hardcharger-ODBC-Driver-x64.msi
      extra-suite: integration_tests/test_hardcharger.py
    secrets: inherit
